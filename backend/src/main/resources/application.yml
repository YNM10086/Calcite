spring:
  application:
    name: calcite
  # 默认激活 local 配置；本地密码写在 application-local.yml（已被 .gitignore 排除，不会上传）
  profiles:
    active: local

  datasource:
    url: jdbc:postgresql://localhost:5432/calcite
    username: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    # none：表结构完全由 scripts/db/*.sql 管理，Hibernate 不碰数据库
    # （之前是 update，会自动建表/改字段；但 PostGIS 的 geometry 列类型
    #   是手写 DDL 声明的，让 Hibernate 去"补"容易把列改坏）
    hibernate:
      ddl-auto: none
    # 关闭 open-in-view，避免 Web 请求期间一直占用数据库连接
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080
