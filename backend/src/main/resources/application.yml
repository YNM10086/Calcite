spring:
  application:
    name: calcite
  # 默认激活 local 配置；本地密码写在 application-local.yml（已被 .gitignore 排除，不会上传）
  profiles:
    active: local

  datasource:
    # reWriteBatchedInserts=true 让 JDBC 驱动把多条 INSERT 合并成一条多值 INSERT，
    # 百万点级导入靠它提速（配合下面的 hibernate.jdbc.batch_size）
    url: jdbc:postgresql://localhost:5432/calcite?reWriteBatchedInserts=true
    username: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    # none：表结构完全由 scripts/db/*.sql 管理，Hibernate 不碰数据库
    # （之前是 update，会自动建表/改字段；但 PostGIS 的 geometry 列类型
    #   是手写 DDL 声明的，让 Hibernate 去"补"容易把列改坏）
    hibernate:
      ddl-auto: none
    # 关闭 open-in-view，避免 Web 请求期间一直占用数据库连接
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        # 批量插入：不配的话 JPA 会逐条 insert，百万点级导入会慢到无法接受
        jdbc:
          batch_size: 500
        order_inserts: true
        order_updates: true

server:
  port: 8080

# 轨迹导入
calcite:
  import:
    # 允许批量导入的根目录白名单。接口收到的 path 必须落在其中之一，否则拒绝。
    # 本地项目不需要登录，但路径必须收敛，避免任意目录读取。
    allowed-roots:
      - D:\Calcite-note\GPX-Data\Geolife Trajectories 1.3\Data
    # 单次批量导入最多处理多少条轨迹。
    # 配合"内容哈希幂等"，脚本循环调用即可自动跳过已导入的、继续往后取。
    max-tracks-per-call: 50
    # 异常速度判定的绝对下限（米/秒）
    max-speed-mps: 8.0
    # 相对倍数：阈值 = max(max-speed-mps, 倍数 × 该轨迹速度中位数)
    # 用中位数是为了自适应 —— GeoLife 里有汽车（20 m/s）甚至火车（80 m/s）轨迹
    speed-median-factor: 3

  # 停留点识别（M2 第一阶段）
  # 判定规则见 docs/superpowers/specs/2026-09-14-m2-stay-point-design.md 第三节
  stay-point:
    # D：停留直径（米）。窗口内所有点到中心的距离不能超过它的一半。
    # 依据：实测 100 米会把「正常步行」误判成停留；30 米又几乎找不到
    radius-m: 50
    # T：最短停留时长（秒）
    min-duration-s: 300
    # G：窗口内相邻两点的最大间隔（秒）。
    # 用来防「信号中断被当成超长停留」—— 实测有条轨迹断了 8217 秒（2.3 小时）
    # 后原地恢复，不加这条会被判成一段 2.3 小时的停留
    max-gap-s: 300

  # 新增：停留热点（M2 第二阶段）
  hotspot:
    # 聚类半径（米）。依据：实测 10 个停留点的 45 对距离里，
    # 118.3 米之后直接跳到 231.5 米（中间空了 113 米），
    # 所以 119~231 米之间任意取值结果完全相同。200 落在空档正中。
    radius-m: 200
    # 至少几个停留点才算热点（只去过一次的地方不算）
    min-visits: 2
