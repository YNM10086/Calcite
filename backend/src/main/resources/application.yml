spring:
  application:
    name: calcite
  # 默认激活 local 配置；本地密码写在 application-local.yml（已被 .gitignore 排除，不会上传）
  profiles:
    active: local

  datasource:
    # reWriteBatchedInserts=true 让 JDBC 驱动把多条 INSERT 合并成一条多值 INSERT，
    # 百万点级导入靠它提速（配合下面的 hibernate.jdbc.batch_size）
    url: jdbc:postgresql://localhost:5432/calcite?reWriteBatchedInserts=true
    username: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    # none：表结构完全由 scripts/db/*.sql 管理，Hibernate 不碰数据库
    # （之前是 update，会自动建表/改字段；但 PostGIS 的 geometry 列类型
    #   是手写 DDL 声明的，让 Hibernate 去"补"容易把列改坏）
    hibernate:
      ddl-auto: none
    # 关闭 open-in-view，避免 Web 请求期间一直占用数据库连接
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        # 批量插入：不配的话 JPA 会逐条 insert，百万点级导入会慢到无法接受
        jdbc:
          batch_size: 500
        order_inserts: true
        order_updates: true

server:
  port: 8080

# 轨迹导入
calcite:
  import:
    # 允许批量导入的根目录白名单。接口收到的 path 必须落在其中之一，否则拒绝。
    # 本地项目不需要登录，但路径必须收敛，避免任意目录读取。
    allowed-roots:
      - D:\Calcite-note\GPX-Data\Geolife Trajectories 1.3\Data
    # 单次批量导入最多处理多少条轨迹。
    # 配合"内容哈希幂等"，脚本循环调用即可自动跳过已导入的、继续往后取。
    max-tracks-per-call: 50
    # 异常速度判定的绝对下限（米/秒）
    max-speed-mps: 8.0
    # 相对倍数：阈值 = max(max-speed-mps, 倍数 × 该轨迹速度中位数)
    # 用中位数是为了自适应 —— GeoLife 里有汽车（20 m/s）甚至火车（80 m/s）轨迹
    speed-median-factor: 3

  # 停留点识别（M2 第一阶段）
  # 判定规则见 docs/superpowers/specs/2026-09-14-m2-stay-point-design.md 第三节
  stay-point:
    # D：停留直径（米）。窗口内所有点到中心的距离不能超过它的一半。
    # 依据：实测 100 米会把「正常步行」误判成停留；30 米又几乎找不到
    radius-m: 50
    # T：最短停留时长（秒）
    min-duration-s: 300
    # G：窗口内相邻两点的最大间隔（秒）。
    # 用来防「信号中断被当成超长停留」—— 实测有条轨迹断了 8217 秒（2.3 小时）
    # 后原地恢复，不加这条会被判成一段 2.3 小时的停留
    max-gap-s: 300

  # 新增：停留热点（M2 第二阶段）
  hotspot:
    # 聚类半径（米）。依据：实测 10 个停留点的 45 对距离里，
    # 118.3 米之后直接跳到 231.5 米（中间空了 113 米），
    # 所以 119~231 米之间任意取值结果完全相同。200 落在空档正中。
    radius-m: 200
    # 至少几个停留点才算热点（只去过一次的地方不算）
    min-visits: 2

  # 网格密度（M2 第三阶段）
  density:
    # 格边长阶梯（度），从粗到细。只允许这些值 ——
    # 这样"换一档"是可复现的离散事件，拖动地图时格子纹丝不动。
    # 最粗一档是 5°：5 × 80 = 400° > 地球一圈 360°，全球视野下也挑得出档
    # （若最粗档只有 0.05°，一打开地图就点"密度"会直接 400）。
    cell-ladder: [5, 2, 1, 0.5, 0.2, 0.1, 0.05, 0.02, 0.01, 0.005, 0.002, 0.001, 0.0005, 0.0002, 0.0001]
    # 视野内目标格数（挑档时用）
    target-cells-across: 80
    # 单次请求的格子数上限（估算值超过它直接 400）
    max-cells: 20000
    # 时区：库里存 UTC，但"早高峰"是北京时间，SQL 里显式转换
    time-zone: Asia/Shanghai

  # 轨迹相似度（M2 第四阶段）
  similarity:
    # 默认容差（米）。实测采样间距 5~42 米、城市 GPS 漂移 10~30 米（见设计文档 2.6 节）
    default-tolerance-m: 50
    # 容差允许范围（防止传 1000000 把所有轨迹都说成"相似"）
    min-tolerance-m: 1
    max-tolerance-m: 1000
    # 默认最多返回多少条（按相似度倒序）
    default-limit: 50
    max-limit: 500

  # 数据管理（删除 / 改名 / 同名替换）
  data:
    # 删除前的自动导出目录。**删之前先导出，导出失败就不删**（fail-safe）
    recycle-dir: D:\Calcite-note\backups\deleted
    # 轨迹显示名的长度上限
    max-name-length: 200
